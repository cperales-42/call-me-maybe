[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pydantic",
    "llm-sdk",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
